    <!-- Critical CSS: inline base variables and above-the-fold skeleton styles to prevent FOUC

    <style>
      /* CSS custom properties — must be available before first paint */
      :root {
        --primary: oklch(0.40 0.1 200);
        --primary-foreground: oklch(0.98 0 0);
        --radius: 0.5rem;
        --background: oklch(0.96 0.01 85);
        --foreground: oklch(0.20 0.02 60);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.20 0.02 60);
        --secondary: oklch(0.92 0.015 85);
        --muted: oklch(0.94 0.01 85);
        --muted-foreground: oklch(0.45 0.02 60);
        --accent: oklch(0.45 0.1 200);
        --accent-foreground: oklch(0.98 0 0);
        --border: oklch(0.88 0.02 85);
        --ring: oklch(0.45 0.1 200);
      }
      /* Base body — correct background before React hydrates */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; -webkit-text-size-adjust: 100%; }
      body {
        background-color: oklch(0.96 0.01 85);
        color: oklch(0.20 0.02 60);
        font-family: 'Open Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Root mount point — full viewport height prevents layout jump */
      #root { min-height: 100dvh; display: flex; flex-direction: column; }
      /* Nav skeleton — reserves 72px header space before React renders */
      #root > header,
      nav[aria-label] {
        height: 72px;
        background-color: oklch(0.20 0.05 200);
        position: sticky;
        top: 0;
        z-index: 50;
      }
      /* Hero skeleton — dark teal background matches hero before image loads */
      #root > main > section:first-child,
      .hero-section {
        min-height: 100dvh;
        background-color: oklch(0.22 0.06 200);
      }
      /* Headings font — matches loaded Playfair Display to prevent reflow */
      h1, h2, h3, h4 {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 700;
      }
    </style>
    <!-- Schema scripts deferred: JSON-LD is crawler-only, no need to block paint -->
