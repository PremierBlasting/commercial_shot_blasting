    <link rel="alternate" hreflang="en" href="https://commercialshotblasting.co.uk/" />

    <!-- Resource hints: preconnect for critical third-party origins -->
    <link rel="preconnect" href="https://files.manuscdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://files.manuscdn.com" />
    <link rel="preconnect" href="https://js-eu1.hsforms.net" crossorigin />
    <link rel="dns-prefetch" href="https://js-eu1.hsforms.net" />
    <link rel="dns-prefetch" href="https://forms.hsforms.com" />
    <link rel="dns-prefetch" href="https://api.manus.im" />
    <!-- Preload first hero image: makes LCP element discoverable by browser preload scanner before React loads -->
    <link
      rel="preload"
      as="image"
      href="https://files.manuscdn.com/user_upload_by_module/session_file/310519663301568782/YScoptyBJOkODpiP.webp"
      imagesrcset="https://files.manuscdn.com/user_upload_by_module/session_file/310519663301568782/IaTezxmvYekRWxDg.webp 640w, https://files.manuscdn.com/user_upload_by_module/session_file/310519663301568782/oVxyFBqOSqiFnIqt.webp 1024w, https://files.manuscdn.com/user_upload_by_module/session_file/310519663301568782/YScoptyBJOkODpiP.webp 1920w"
      imagesizes="(max-width: 640px) 640px, (max-width: 1024px) 1024px, 1920px"
      crossorigin
    />
    <!-- Fonts are self-hosted via @fontsource — no external CDN needed -->
    <!-- Critical CSS: ONLY CSS variables + body background. No resets — Tailwind handles those.
         This ensures the correct background colour and font-family are applied from first paint,
         before the Vite CSS bundle downloads, eliminating flash of white/unstyled content. -->
    <style>
      :root {
        --primary: oklch(0.40 0.1 200);
        --primary-foreground: oklch(0.98 0 0);
        --radius: 0.5rem;
        --background: oklch(0.96 0.01 85);
        --foreground: oklch(0.20 0.02 60);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.20 0.02 60);
        --secondary: oklch(0.92 0.015 85);
        --muted: oklch(0.94 0.01 85);
        --muted-foreground: oklch(0.45 0.02 60);
        --accent: oklch(0.45 0.1 200);
        --accent-foreground: oklch(0.98 0 0);
        --border: oklch(0.88 0.02 85);
        --ring: oklch(0.45 0.1 200);
      }
      body {
        background-color: oklch(0.96 0.01 85);
        color: oklch(0.20 0.02 60);
        font-family: 'Open Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    <!-- noscript: when JS is disabled, override opacity:0 on lazy images so they display immediately -->
    <noscript>
      <style>
        img[loading="lazy"] { opacity: 1 !important; }
        img.opacity-0 { opacity: 1 !important; }
      </style>
    </noscript>
    <!-- Schema scripts deferred: JSON-LD is crawler-only, no need to block paint -->
    <script src="/schema-bootstrap.js" defer></script>
    <script src="/schema-service.js" defer></script>
    <script src="/jsonld-inject.js" defer></script>
  </head>

  <body>
    <!--SSR_CONTENT-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- HubSpot script loaded only on Contact page to avoid loading on every page -->
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
